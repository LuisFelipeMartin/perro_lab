<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Perro Robot ESP32</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      padding: 15px;
      margin: 0;
    }
    h1 { color: #00e676; font-size: 1.6rem; margin-bottom: 5px; }
    .status { margin-bottom: 15px; font-weight: bold; color: #ff5252; }
    .status.connected { color: #00e676; }
    
    .btn {
      background-color: #1e88e5;
      color: white;
      border: none;
      padding: 12px 20px;
      margin: 5px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      width: 42%;
      max-width: 180px;
      touch-action: manipulation;
    }
    .btn:active { background-color: #1565c0; transform: scale(0.98); }
    .btn-stop { background-color: #e53935; width: 90%; max-width: 370px; }
    .btn-stop:active { background-color: #c62828; }
    
    .btn-conn { background-color: #00c853; width: 44%; max-width: 180px; margin-bottom: 15px; }
    .btn-conn:active { background-color: #009624; }
    .btn-disconn { background-color: #d32f2f; width: 44%; max-width: 180px; margin-bottom: 15px; }
    .btn-disconn:active { background-color: #b71c1c; }
    .btn-confirm { background-color: #ff9800; width: 90%; max-width: 370px; margin-top: 10px; color: #000; }
    .btn-confirm:active { background-color: #f57c00; }

    .card {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 12px;
      margin: 10px auto;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      box-sizing: border-box;
    }
    .card h2 { font-size: 1.1rem; color: #bb86fc; margin-top: 0; }
    
    /* ESTILOS PARA LOS DESPLEGABLES */
    details.card {
      text-align: left;
    }
    details.card summary {
      font-size: 1.1rem;
      color: #bb86fc;
      font-weight: bold;
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      outline: none;
      user-select: none;
    }
    details.card summary::-webkit-details-marker { display: none; }
    details.card summary::after {
      content: '▼';
      font-size: 0.8rem;
      color: #00e676;
      transition: transform 0.2s ease;
    }
    details[open] summary::after {
      transform: rotate(180deg);
    }
    .panel-body {
      margin-top: 15px;
      text-align: center;
    }

    .slider-group { margin: 12px 0; text-align: left; }
    .slider-group label { display: block; font-size: 0.9rem; margin-bottom: 4px; }
    .slider-group span.val-highlight { color: #00e676; font-weight: bold; }
    input[type=range], input[type=number] { width: 100%; box-sizing: border-box; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; }
    .grid-2 label { font-size: 0.85rem; }
    .grid-2 input { padding: 8px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 0.95rem; }
  </style>
</head>
<body>

  <h1>Perro Robot Control</h1>
  <div id="status" class="status">Desconectado</div>
  
  <div>
    <button class="btn btn-conn" onclick="conectarBLE()">Conectar</button>
    <button class="btn btn-disconn" onclick="desconectarBLE()">Desconectar</button>
  </div>

  <div class="card">
    <h2>Parada de Emergencia</h2>
    <button class="btn btn-stop" onclick="enviar('0')">¡DETENER TODO!</button>
  </div>

  <div class="card">
    <h2>Animaciones Continuas</h2>
    <button class="btn" onclick="enviar('cola')">Cola ON</button>
    <button class="btn" onclick="enviar('0cola')">Cola OFF</button><br>
    <button class="btn" onclick="enviar('cuello')">Cuello ON</button>
    <button class="btn" onclick="enviar('0cuello')">Cuello OFF</button><br>
    <button class="btn" onclick="enviar('asentir')">Asentir ON</button>
    <button class="btn" onclick="enviar('0asentir')">Asentir OFF</button>
  </div>

  <div class="card">
    <h2>Posturas de Cabeza</h2>
    <button class="btn" onclick="enviar('ladeari')">Ladear Izq (77°)</button>
    <button class="btn" onclick="enviar('ladeard')">Ladear Der (103°)</button><br>
    <button class="btn" style="width: 90%; margin-top: 8px;" onclick="enviar('0ladear')">Centrar Cabeza (90°)</button>
  </div>

  <!-- SECCIÓN DESPLEGABLE: CALIBRACIÓN DE CENTROS -->
  <details class="card">
    <summary>⚙️ Calibración de Centros (Offsets)</summary>
    <div class="panel-body">
      <div class="grid-2">
        <div>
          <label>Centro Cola (°):</label>
          <input type="number" id="cCola" value="90" min="0" max="180">
        </div>
        <div>
          <label>Centro Cuello (°):</label>
          <input type="number" id="cCuello" value="120" min="0" max="180">
        </div>
        <div>
          <label>Centro Cabeza 1 (S3):</label>
          <input type="number" id="cS3" value="85" min="0" max="180">
        </div>
        <div>
          <label>Centro Cabeza 2 (S4):</label>
          <input type="number" id="cS4" value="95" min="0" max="180">
        </div>
      </div>
      <button class="btn btn-confirm" onclick="confirmarCentro()">Confirmar Centro</button>
    </div>
  </details>

  <!-- SECCIÓN DESPLEGABLE: MODO MANUAL RELATIVO -->
  <details class="card">
    <summary>🎛️ Giro Manual (Relativo)</summary>
    <div class="panel-body">
      <div class="slider-group">
        <label>Cola: <span id="vCola" class="val-highlight">0°</span> <small id="vColaAbs">(Abs: 90°)</small></label>
        <input type="range" id="sCola" value="0" oninput="actualizarLabelCola()">
      </div>

      <div class="slider-group">
        <label>Cuello: <span id="vCuello" class="val-highlight">0°</span> <small id="vCuelloAbs">(Abs: 120°)</small></label>
        <input type="range" id="sCuello" value="0" oninput="actualizarLabelCuello()">
      </div>

      <div class="slider-group">
        <label>Pitch (Inclinación): <span id="vPitch" class="val-highlight">0°</span> <small id="vPitchAbs">(Abs: 90°)</small></label>
        <input type="range" id="sPitch" min="-30" max="30" value="0" oninput="actualizarLabelPitch()">
      </div>

      <div class="slider-group">
        <label>Roll (Giro): <span id="vRoll" class="val-highlight">0°</span> <small id="vRollAbs">(Abs: 90°)</small></label>
        <input type="range" id="sRoll" min="-30" max="30" value="0" oninput="actualizarLabelRoll()">
      </div>

      <button class="btn" style="width: 90%; margin-top: 10px;" onclick="enviarManual()">Enviar Posición Manual</button>
    </div>
  </details>

  <script>
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const CHARACTERISTIC_RX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

    let bluetoothDevice;
    let rxCharacteristic;

    // Centros activos registrados
    let centroCola = 90;
    let centroCuello = 120;
    let centroS3 = 85;
    let centroS4 = 95;

    window.onload = function() {
      recalcularLimitesSliders();
    };

    function recalcularLimitesSliders() {
      const sCola = document.getElementById('sCola');
      sCola.min = 0 - centroCola;
      sCola.max = 180 - centroCola;
      sCola.value = 0;

      const sCuello = document.getElementById('sCuello');
      sCuello.min = 0 - centroCuello;
      sCuello.max = 180 - centroCuello;
      sCuello.value = 0;

      document.getElementById('sPitch').value = 0;
      document.getElementById('sRoll').value = 0;

      actualizarLabelCola();
      actualizarLabelCuello();
      actualizarLabelPitch();
      actualizarLabelRoll();
    }

    function actualizarLabelCola() {
      const rel = parseInt(document.getElementById('sCola').value);
      const abs = centroCola + rel;
      document.getElementById('vCola').innerText = (rel > 0 ? "+" + rel : rel) + "°";
      document.getElementById('vColaAbs').innerText = `(Abs: ${abs}°)`;
    }

    function actualizarLabelCuello() {
      const rel = parseInt(document.getElementById('sCuello').value);
      const abs = centroCuello + rel;
      document.getElementById('vCuello').innerText = (rel > 0 ? "+" + rel : rel) + "°";
      document.getElementById('vCuelloAbs').innerText = `(Abs: ${abs}°)`;
    }

    function actualizarLabelPitch() {
      const rel = parseInt(document.getElementById('sPitch').value);
      const abs = 90 + rel;
      document.getElementById('vPitch').innerText = (rel > 0 ? "+" + rel : rel) + "°";
      document.getElementById('vPitchAbs').innerText = `(Abs: ${abs}°)`;
    }

    function actualizarLabelRoll() {
      const rel = parseInt(document.getElementById('sRoll').value);
      const abs = 90 + rel;
      document.getElementById('vRoll').innerText = (rel > 0 ? "+" + rel : rel) + "°";
      document.getElementById('vRollAbs').innerText = `(Abs: ${abs}°)`;
    }

    function confirmarCentro() {
      centroCola = parseInt(document.getElementById('cCola').value) || 90;
      centroCuello = parseInt(document.getElementById('cCuello').value) || 120;
      centroS3 = parseInt(document.getElementById('cS3').value) || 85;
      centroS4 = parseInt(document.getElementById('cS4').value) || 95;

      recalcularLimitesSliders();

      const cmd = `center,${centroCola},${centroCuello},${centroS3},${centroS4}`;
      enviar(cmd);
    }

    async function conectarBLE() {
      try {
        const statusDiv = document.getElementById('status');
        statusDiv.innerText = "Buscando ESP32...";

        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'PerroRobot_ESP32' }],
          optionalServices: [SERVICE_UUID]
        });

        bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_RX_UUID);

        statusDiv.innerText = "¡Conectado!";
        statusDiv.classList.add("connected");
      } catch (error) {
        console.error(error);
        document.getElementById('status').innerText = "Error al conectar";
      }
    }

    function desconectarBLE() {
      if (bluetoothDevice && bluetoothDevice.gatt.connected) {
        bluetoothDevice.gatt.disconnect();
      } else {
        alert("No hay ningún dispositivo conectado actualmente.");
      }
    }

    function onDisconnected() {
      const statusDiv = document.getElementById('status');
      statusDiv.innerText = "Desconectado";
      statusDiv.classList.remove("connected");
      rxCharacteristic = null;
    }

    async function enviar(cmd) {
      if (!rxCharacteristic) {
        alert("Primero debes conectar el Bluetooth");
        return;
      }
      try {
        const encoder = new TextEncoder();
        await rxCharacteristic.writeValue(encoder.encode(cmd + "\n"));
      } catch (error) {
        console.error("Error al enviar comando:", error);
      }
    }

    function enviarManual() {
      const relCola = parseInt(document.getElementById('sCola').value);
      const relCuello = parseInt(document.getElementById('sCuello').value);
      const relPitch = parseInt(document.getElementById('sPitch').value);
      const relRoll = parseInt(document.getElementById('sRoll').value);

      const absCola = centroCola + relCola;
      const absCuello = centroCuello + relCuello;
      const absPitch = 90 + relPitch;
      const absRoll = 90 + relRoll;

      const cmd = `${absCola},${absCuello},${absPitch},${absRoll},30`;
      enviar(cmd);
    }
  </script>
</body>
</html>
